name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Update npm
        run: npm install -g npm@latest
      - name: Test
        run: npm test
      - name: Check the tag and changelog
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          node scripts/release-check.mjs --tag "$TAG"
      - name: Prepare the npm package
        run: |
          # The repository package stays browser-bridge so the local plugin and
          # its icon/locale metadata resolve. npm gets a copy named dsh-bsb, and
          # the row's name specifier must match that installed package.
          mkdir -p "$RUNNER_TEMP/npm"
          rsync -a --exclude node_modules --exclude .git --exclude dist ./ "$RUNNER_TEMP/npm/"
          cd "$RUNNER_TEMP/npm"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.name='dsh-bsb';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          node -e "const fs=require('fs');let s=fs.readFileSync('cordis.patch.yml','utf8');s=s.replace(\"name: 'dsh-browser-bridge'\", \"name: 'dsh-bsb'\");fs.writeFileSync('cordis.patch.yml',s)"
          node -e "const fs=require('fs');let s=fs.readFileSync('client.js','utf8');s=s.replace(\"id: 'dsh-browser-bridge'\", \"id: 'dsh-bsb'\");fs.writeFileSync('client.js',s)"
      - name: Pack
        working-directory: ${{ runner.temp }}/npm
        run: npm pack --dry-run
      - name: Publish
        if: github.event_name == 'push'
        working-directory: ${{ runner.temp }}/npm
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${NAME}@${VERSION} is already published; nothing to do"
            exit 0
          fi
          npm publish --provenance --access public
      - name: Publish dry run
        if: github.event_name == 'workflow_dispatch'
        working-directory: ${{ runner.temp }}/npm
        run: npm publish --dry-run --access public
